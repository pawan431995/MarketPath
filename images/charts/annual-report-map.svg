<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Where to look in an annual report"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="300" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Where to look in an annual report</text><rect x="22" y="56" width="175" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="22" y="56" width="175" height="4" rx="2" fill="#45a9d9"/><text x="34" y="86" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Letter to shareholders</text><text x="34" y="106" fill="#9caec4" font-size="11" text-anchor="start">Management's story</text><rect x="210" y="56" width="175" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="210" y="56" width="175" height="4" rx="2" fill="#45a9d9"/><text x="222" y="86" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">MD&amp;A</text><text x="222" y="106" fill="#9caec4" font-size="11" text-anchor="start">Business, industry, risks</text><rect x="398" y="56" width="175" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="398" y="56" width="175" height="4" rx="2" fill="#48e0b0"/><text x="410" y="86" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Financial statements</text><text x="410" y="106" fill="#9caec4" font-size="11" text-anchor="start">P&amp;L, balance sheet, cash flow</text><rect x="586" y="56" width="175" height="92" rx="8" fill="#142238" stroke="#ff8e98" stroke-width="2"/><rect x="586" y="56" width="175" height="4" rx="2" fill="#ffd27a"/><text x="598" y="86" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Notes to accounts</text><text x="598" y="106" fill="#9caec4" font-size="11" text-anchor="start">Details behind every number</text><text x="598" y="132" fill="#ff8e98" font-size="11" text-anchor="start" font-weight="700">Check for red flags</text><rect x="22" y="166" width="175" height="92" rx="8" fill="#142238" stroke="#ff8e98" stroke-width="2"/><rect x="22" y="166" width="175" height="4" rx="2" fill="#ff8e98"/><text x="34" y="196" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Auditor's report</text><text x="34" y="216" fill="#9caec4" font-size="11" text-anchor="start">Qualifications and emphasis</text><text x="34" y="242" fill="#ff8e98" font-size="11" text-anchor="start" font-weight="700">Check for red flags</text><rect x="210" y="166" width="175" height="92" rx="8" fill="#142238" stroke="#ff8e98" stroke-width="2"/><rect x="210" y="166" width="175" height="4" rx="2" fill="#ff8e98"/><text x="222" y="196" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Related-party transactions</text><text x="222" y="216" fill="#9caec4" font-size="11" text-anchor="start">Deals with promoter entities</text><text x="222" y="242" fill="#ff8e98" font-size="11" text-anchor="start" font-weight="700">Check for red flags</text><rect x="398" y="166" width="175" height="92" rx="8" fill="#142238" stroke="#ff8e98" stroke-width="2"/><rect x="398" y="166" width="175" height="4" rx="2" fill="#ffd27a"/><text x="410" y="196" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Contingent liabilities</text><text x="410" y="216" fill="#9caec4" font-size="11" text-anchor="start">Possible future claims</text><text x="410" y="242" fill="#ff8e98" font-size="11" text-anchor="start" font-weight="700">Check for red flags</text><rect x="586" y="166" width="175" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="586" y="166" width="175" height="4" rx="2" fill="#a994ff"/><text x="598" y="196" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Corporate governance</text><text x="598" y="216" fill="#9caec4" font-size="11" text-anchor="start">Board, pay, attendance</text><text x="20" y="288" fill="#9caec4" font-size="11" text-anchor="start">Red borders: sections where problems usually hide. Read them before the glossy pages.</text></svg>
