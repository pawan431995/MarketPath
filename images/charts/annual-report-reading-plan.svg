<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Reading an annual report in 60 minutes"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="270" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Reading an annual report in 60 minutes</text><text x="79" y="68" fill="#ff8e98" font-size="11" text-anchor="middle" font-weight="700">0–10 min</text><rect x="20" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="20" y="80" width="118" height="4" rx="2" fill="#ff8e98"/><text x="79" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Auditor's report</text><text x="79" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Opinion type</text><text x="79" y="144" fill="#9caec4" font-size="11" text-anchor="middle">Key audit matters</text><line x1="139" y1="123" x2="145" y2="123" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="205" y="68" fill="#48e0b0" font-size="11" text-anchor="middle" font-weight="700">10–20 min</text><rect x="146" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="146" y="80" width="118" height="4" rx="2" fill="#48e0b0"/><text x="205" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Statements</text><text x="205" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Five-year trend</text><text x="205" y="144" fill="#9caec4" font-size="11" text-anchor="middle">Cash and debt</text><line x1="265" y1="123" x2="271" y2="123" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="331" y="68" fill="#ffd27a" font-size="11" text-anchor="middle" font-weight="700">20–35 min</text><rect x="272" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="272" y="80" width="118" height="4" rx="2" fill="#ffd27a"/><text x="331" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Notes</text><text x="331" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Related parties</text><text x="331" y="144" fill="#9caec4" font-size="11" text-anchor="middle">Contingent claims</text><line x1="391" y1="123" x2="397" y2="123" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="457" y="68" fill="#45a9d9" font-size="11" text-anchor="middle" font-weight="700">35–45 min</text><rect x="398" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="398" y="80" width="118" height="4" rx="2" fill="#45a9d9"/><text x="457" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">MD&amp;A</text><text x="457" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Segments, risks</text><text x="457" y="144" fill="#9caec4" font-size="11" text-anchor="middle">Promises vs results</text><line x1="517" y1="123" x2="523" y2="123" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="583" y="68" fill="#a994ff" font-size="11" text-anchor="middle" font-weight="700">45–55 min</text><rect x="524" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="524" y="80" width="118" height="4" rx="2" fill="#a994ff"/><text x="583" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Governance</text><text x="583" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Board, auditors</text><text x="583" y="144" fill="#9caec4" font-size="11" text-anchor="middle">Pay vs profit</text><line x1="643" y1="123" x2="649" y2="123" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="709" y="68" fill="#9caec4" font-size="11" text-anchor="middle" font-weight="700">55–60 min</text><rect x="650" y="80" width="118" height="86" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="650" y="80" width="118" height="4" rx="2" fill="#9caec4"/><text x="709" y="108" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Chairman's letter</text><text x="709" y="128" fill="#9caec4" font-size="11" text-anchor="middle">Tone and claims</text><text x="709" y="144" fill="#9caec4" font-size="11" text-anchor="middle">vs last year</text><rect x="20" y="190" width="370" height="40" rx="8" fill="#2a1c20" stroke="#ff8e98" stroke-width="1.5"/><text x="36" y="215" fill="#ff8e98" font-size="12" text-anchor="start" font-weight="700">Most information per minute: start here</text><rect x="410" y="190" width="370" height="40" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><text x="426" y="215" fill="#9caec4" font-size="12" text-anchor="start">Least information per minute: read last</text><text x="20" y="258" fill="#9caec4" font-size="11" text-anchor="start">The order matters more than the speed: problems usually show up in the audit report and the notes.</text></svg>
