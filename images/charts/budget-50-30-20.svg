<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The 50/30/20 budget on a take-home salary of ₹60,000"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="290" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">The 50/30/20 budget on a take-home salary of ₹60,000</text><rect x="41" y="62" width="358" height="44" rx="6" fill="#45a9d9" opacity="0.9"/><text x="220" y="90" fill="#0e1726" font-size="15" text-anchor="middle" font-weight="700">50%</text><rect x="401" y="62" width="214" height="44" rx="6" fill="#a994ff" opacity="0.9"/><text x="508" y="90" fill="#0e1726" font-size="15" text-anchor="middle" font-weight="700">30%</text><rect x="617" y="62" width="142" height="44" rx="6" fill="#48e0b0" opacity="0.9"/><text x="688" y="90" fill="#0e1726" font-size="15" text-anchor="middle" font-weight="700">20%</text><rect x="40" y="128" width="228" height="112" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="40" y="128" width="228" height="4" rx="2" fill="#45a9d9"/><text x="54" y="156" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Needs</text><text x="54" y="182" fill="#45a9d9" font-size="18" text-anchor="start" font-weight="700">₹30,000</text><text x="54" y="206" fill="#9caec4" font-size="11" text-anchor="start">Rent, groceries, bills,</text><text x="54" y="222" fill="#9caec4" font-size="11" text-anchor="start">school fees, minimum EMIs</text><rect x="286" y="128" width="228" height="112" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="286" y="128" width="228" height="4" rx="2" fill="#a994ff"/><text x="300" y="156" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Wants</text><text x="300" y="182" fill="#a994ff" font-size="18" text-anchor="start" font-weight="700">₹18,000</text><text x="300" y="206" fill="#9caec4" font-size="11" text-anchor="start">Eating out, shopping,</text><text x="300" y="222" fill="#9caec4" font-size="11" text-anchor="start">trips, subscriptions</text><rect x="532" y="128" width="228" height="112" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="532" y="128" width="228" height="4" rx="2" fill="#48e0b0"/><text x="546" y="156" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Savings and investing</text><text x="546" y="182" fill="#48e0b0" font-size="18" text-anchor="start" font-weight="700">₹12,000</text><text x="546" y="206" fill="#9caec4" font-size="11" text-anchor="start">Emergency fund, SIPs,</text><text x="546" y="222" fill="#9caec4" font-size="11" text-anchor="start">extra loan repayment</text><text x="20" y="278" fill="#9caec4" font-size="11" text-anchor="start">A starting point: adjust the split for your city and family, and automate the savings on the day after your salary arrives.</text></svg>
