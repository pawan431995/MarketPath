<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="How gains from shares are taxed in India (rules from 23 July 2024)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="330" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">How gains from shares are taxed in India (rules from 23 July 2024)</text><rect x="40" y="90" width="354" height="70" rx="8" fill="#2a2416" stroke="#ffd27a" stroke-width="1.5"/><rect x="406" y="90" width="354" height="70" rx="8" fill="#132f31" stroke="#48e0b0" stroke-width="1.5"/><text x="56" y="118" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Held 12 months or less: short-term (STCG)</text><text x="56" y="140" fill="#9caec4" font-size="12" text-anchor="start">Taxed at 20% (listed shares, equity funds)</text><text x="422" y="118" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Held more than 12 months: long-term (LTCG)</text><text x="422" y="140" fill="#9caec4" font-size="12" text-anchor="start">12.5% on gains above ₹1.25 lakh a year</text><line x1="40" y1="190" x2="760" y2="190" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><text x="40" y="212" fill="#9caec4" font-size="11" text-anchor="start">Buy date</text><text x="400" y="212" fill="#9caec4" font-size="11" text-anchor="middle">12 months</text><rect x="40" y="240" width="350" height="50" rx="8" fill="#142238" stroke="#a994ff" stroke-width="1.5"/><text x="56" y="262" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Intraday trading</text><text x="56" y="280" fill="#9caec4" font-size="11.5" text-anchor="start">Speculative business income, at your slab rate</text><rect x="410" y="240" width="350" height="50" rx="8" fill="#142238" stroke="#45a9d9" stroke-width="1.5"/><text x="426" y="262" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Futures &amp; options</text><text x="426" y="280" fill="#9caec4" font-size="11.5" text-anchor="start">Non-speculative business income, at your slab rate</text><text x="20" y="318" fill="#9caec4" font-size="11" text-anchor="start">Plus 4% cess. Rates change with budgets: check incometax.gov.in before filing.</text></svg>
