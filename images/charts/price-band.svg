<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Price band: a stock hits its upper circuit (20% band, illustrative)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="320" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Price band: a stock hits its upper circuit (20% band, illustrative)</text><line x1="60" y1="228.3" x2="760" y2="228.3" stroke="#2b3d54" stroke-width="1" stroke-dasharray="4 4"/><text x="54" y="232.3" fill="#9caec4" font-size="11" text-anchor="end">100</text><line x1="60" y1="101.7" x2="760" y2="101.7" stroke="#ff8e98" stroke-width="2" stroke-dasharray="6 4"/><text x="760" y="93.7" fill="#ff8e98" font-size="12" text-anchor="end" font-weight="700">Upper circuit ₹120 (+20%)</text><polyline points="60,228.3 96.3,222 132.6,209.3 168.9,215.7 205.3,196.7 241.6,177.7 277.9,184 314.2,158.7 350.5,139.7 386.8,146 423.2,120.7 459.5,108 495.8,101.7 532.1,101.7 568.4,101.7 604.7,101.7 641.1,101.7 677.4,101.7 713.7,101.7 750,101.7" fill="none" stroke="#48e0b0" stroke-width="3" stroke-linejoin="round"/><rect x="495.8" y="115.7" width="254.2" height="62" rx="8" fill="#2a1d24" stroke="#ff8e98" stroke-width="1.5"/><text x="507.8" y="137.7" fill="#e7edf5" font-size="12" text-anchor="start" font-weight="700">Frozen at the band</text><text x="507.8" y="155.7" fill="#9caec4" font-size="11" text-anchor="start">Only buyers left; trades only</text><text x="507.8" y="169.7" fill="#9caec4" font-size="11" text-anchor="start">at ₹120 if sellers appear.</text><text x="60" y="290" fill="#9caec4" font-size="12" text-anchor="start">Lower circuit is the mirror image: only sellers, and you may be unable to exit.</text></svg>
