<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Working-capital days over three years (Example Ltd, illustrative)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="340" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Working-capital days over three years (Example Ltd, illustrative)</text><line x1="70" y1="260" x2="540" y2="260" stroke="#2b3d54" stroke-width="1"/><text x="62" y="264" fill="#9caec4" font-size="10.5" text-anchor="end">0</text><line x1="70" y1="210" x2="540" y2="210" stroke="#2b3d54" stroke-width="1" stroke-dasharray="3 4"/><text x="62" y="214" fill="#9caec4" font-size="10.5" text-anchor="end">25</text><line x1="70" y1="160" x2="540" y2="160" stroke="#2b3d54" stroke-width="1" stroke-dasharray="3 4"/><text x="62" y="164" fill="#9caec4" font-size="10.5" text-anchor="end">50</text><line x1="70" y1="110" x2="540" y2="110" stroke="#2b3d54" stroke-width="1" stroke-dasharray="3 4"/><text x="62" y="114" fill="#9caec4" font-size="10.5" text-anchor="end">75</text><line x1="70" y1="60" x2="540" y2="60" stroke="#2b3d54" stroke-width="1" stroke-dasharray="3 4"/><text x="62" y="64" fill="#9caec4" font-size="10.5" text-anchor="end">100</text><rect x="99.3" y="160" width="30" height="100" rx="3" fill="#ffd27a" opacity="0.92"/><text x="114.3" y="155" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">50</text><rect x="133.3" y="140" width="30" height="120" rx="3" fill="#a994ff" opacity="0.92"/><text x="148.3" y="135" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">60</text><rect x="167.3" y="108" width="30" height="152" rx="3" fill="#45a9d9" opacity="0.92"/><text x="182.3" y="103" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">76</text><text x="148.3" y="278" fill="#9caec4" font-size="11.5" text-anchor="middle">FY23</text><rect x="256" y="150" width="30" height="110" rx="3" fill="#ffd27a" opacity="0.92"/><text x="271" y="145" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">55</text><rect x="290" y="130" width="30" height="130" rx="3" fill="#a994ff" opacity="0.92"/><text x="305" y="125" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">65</text><rect x="324" y="104" width="30" height="156" rx="3" fill="#45a9d9" opacity="0.92"/><text x="339" y="99" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">78</text><text x="305" y="278" fill="#9caec4" font-size="11.5" text-anchor="middle">FY24</text><rect x="412.7" y="110" width="30" height="150" rx="3" fill="#ffd27a" opacity="0.92"/><text x="427.7" y="105" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">75</text><rect x="446.7" y="76" width="30" height="184" rx="3" fill="#a994ff" opacity="0.92"/><text x="461.7" y="71" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">92</text><rect x="480.7" y="104" width="30" height="156" rx="3" fill="#45a9d9" opacity="0.92"/><text x="495.7" y="99" fill="#e7edf5" font-size="10.5" text-anchor="middle" font-weight="700">78</text><text x="461.7" y="278" fill="#9caec4" font-size="11.5" text-anchor="middle">FY25</text><rect x="580" y="70" width="12" height="12" rx="3" fill="#ffd27a"/><text x="600" y="80" fill="#e7edf5" font-size="12" text-anchor="start">Receivable days</text><rect x="580" y="92" width="12" height="12" rx="3" fill="#a994ff"/><text x="600" y="102" fill="#e7edf5" font-size="12" text-anchor="start">Inventory days</text><rect x="580" y="114" width="12" height="12" rx="3" fill="#45a9d9"/><text x="600" y="124" fill="#e7edf5" font-size="12" text-anchor="start">Payable days</text><rect x="570" y="160" width="210" height="100" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><text x="586" y="186" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Cash conversion cycle</text><text x="586" y="210" fill="#9caec4" font-size="11.5" text-anchor="start">FY23: 50 + 60 − 76 = 34 days</text><text x="586" y="228" fill="#9caec4" font-size="11.5" text-anchor="start">FY24: 55 + 65 − 78 = 42 days</text><text x="586" y="246" fill="#ff8e98" font-size="11.5" text-anchor="start" font-weight="700">FY25: 75 + 92 − 78 = 89 days</text><text x="20" y="328" fill="#9caec4" font-size="11" text-anchor="start">Customers paying later and stock piling up lock the company's cash into operations; the gap is usually filled with debt.</text></svg>
