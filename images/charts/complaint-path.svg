<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="If something goes wrong: where to complain (keep every record)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="310" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">If something goes wrong: where to complain (keep every record)</text><rect x="30" y="66" width="210" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="30" y="66" width="210" height="4" rx="2" fill="#48e0b0"/><text x="135" y="94" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">1. Your broker or DP</text><text x="135" y="114" fill="#9caec4" font-size="11" text-anchor="middle">Written complaint</text><text x="135" y="130" fill="#9caec4" font-size="11" text-anchor="middle">with trade details</text><line x1="244" y1="112" x2="276" y2="112" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="280" y="66" width="210" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="280" y="66" width="210" height="4" rx="2" fill="#a994ff"/><text x="385" y="94" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">2. SEBI SCORES</text><text x="385" y="114" fill="#9caec4" font-size="11" text-anchor="middle">scores.sebi.gov.in</text><text x="385" y="130" fill="#9caec4" font-size="11" text-anchor="middle">tracked to closure</text><line x1="494" y1="112" x2="526" y2="112" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="530" y="66" width="210" height="92" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="530" y="66" width="210" height="4" rx="2" fill="#45a9d9"/><text x="635" y="94" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">3. SMART ODR</text><text x="635" y="114" fill="#9caec4" font-size="11" text-anchor="middle">smartodr.in</text><text x="635" y="130" fill="#9caec4" font-size="11" text-anchor="middle">conciliation, arbitration</text><text x="400" y="186" fill="#9caec4" font-size="12" text-anchor="middle">Not resolved? Move to the next step.</text><rect x="30" y="206" width="740" height="64" rx="8" fill="#2a1d24" stroke="#ff8e98" stroke-width="1.5"/><text x="48" y="232" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Scam by an unregistered person (fake app, Telegram tips, 'guaranteed returns')?</text><text x="48" y="252" fill="#9caec4" font-size="12" text-anchor="start">Report at once on cybercrime.gov.in or call 1930, and tell your bank to stop the payment.</text></svg>
