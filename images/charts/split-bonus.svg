<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Bonus issue and stock split: more shares, same total value"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="320" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Bonus issue and stock split: more shares, same total value</text><rect x="30" y="70" width="220" height="150" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="30" y="70" width="220" height="4" rx="2" fill="#45a9d9"/><text x="140" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Before</text><text x="140" y="118" fill="#9caec4" font-size="11" text-anchor="middle">100 shares × ₹1,000</text><text x="140" y="134" fill="#9caec4" font-size="11" text-anchor="middle">Face value ₹10</text><text x="140" y="190" fill="#48e0b0" font-size="20" text-anchor="middle" font-weight="700">₹1,00,000</text><line x1="254" y1="145" x2="276" y2="145" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="280" y="70" width="220" height="150" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="280" y="70" width="220" height="4" rx="2" fill="#48e0b0"/><text x="390" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">After 1:1 bonus</text><text x="390" y="118" fill="#9caec4" font-size="11" text-anchor="middle">200 shares × ₹500</text><text x="390" y="134" fill="#9caec4" font-size="11" text-anchor="middle">Face value ₹10</text><text x="390" y="190" fill="#48e0b0" font-size="20" text-anchor="middle" font-weight="700">₹1,00,000</text><text x="515" y="150" fill="#9caec4" font-size="13" text-anchor="middle" font-weight="700">or</text><rect x="530" y="70" width="220" height="150" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="530" y="70" width="220" height="4" rx="2" fill="#a994ff"/><text x="640" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">After 1:5 split</text><text x="640" y="118" fill="#9caec4" font-size="11" text-anchor="middle">500 shares × ₹200</text><text x="640" y="134" fill="#9caec4" font-size="11" text-anchor="middle">Face value ₹2</text><text x="640" y="190" fill="#48e0b0" font-size="20" text-anchor="middle" font-weight="700">₹1,00,000</text><text x="400" y="248" fill="#9caec4" font-size="12" text-anchor="middle">Each example starts from the same 100 shares.</text><text x="400" y="270" fill="#9caec4" font-size="13" text-anchor="middle">The price adjusts on the ex-date, so your holding is worth the same.</text><text x="400" y="290" fill="#9caec4" font-size="13" text-anchor="middle">Remember to adjust your average buy price for tax records.</text></svg>
