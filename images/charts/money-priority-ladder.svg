<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The order to manage your money: start at the bottom"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="410" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">The order to manage your money: start at the bottom</text><rect x="60" y="316" width="680" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="60" y="316" width="6" height="44" rx="3" fill="#45a9d9"/><text x="82" y="344" fill="#45a9d9" font-size="15" text-anchor="start" font-weight="700">1</text><text x="104" y="336" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Budget</text><text x="104" y="352" fill="#9caec4" font-size="11" text-anchor="start">Know what comes in and goes out; automate saving</text><rect x="82" y="264" width="636" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="82" y="264" width="6" height="44" rx="3" fill="#48e0b0"/><text x="104" y="292" fill="#48e0b0" font-size="15" text-anchor="start" font-weight="700">2</text><text x="126" y="284" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Starter emergency fund</text><text x="126" y="300" fill="#9caec4" font-size="11" text-anchor="start">About one month of expenses</text><rect x="104" y="212" width="592" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="104" y="212" width="6" height="44" rx="3" fill="#a994ff"/><text x="126" y="240" fill="#a994ff" font-size="15" text-anchor="start" font-weight="700">3</text><text x="148" y="232" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Insurance</text><text x="148" y="248" fill="#9caec4" font-size="11" text-anchor="start">Health cover, and term cover if anyone depends on you</text><rect x="126" y="160" width="548" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="126" y="160" width="6" height="44" rx="3" fill="#ff8e98"/><text x="148" y="188" fill="#ff8e98" font-size="15" text-anchor="start" font-weight="700">4</text><text x="170" y="180" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Clear costly debt</text><text x="170" y="196" fill="#9caec4" font-size="11" text-anchor="start">Credit cards and personal loans first</text><rect x="148" y="108" width="504" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="148" y="108" width="6" height="44" rx="3" fill="#48e0b0"/><text x="170" y="136" fill="#48e0b0" font-size="15" text-anchor="start" font-weight="700">5</text><text x="192" y="128" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Full emergency fund</text><text x="192" y="144" fill="#9caec4" font-size="11" text-anchor="start">3 to 6 months of essential expenses</text><rect x="170" y="56" width="460" height="44" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="170" y="56" width="6" height="44" rx="3" fill="#ffd27a"/><text x="192" y="84" fill="#ffd27a" font-size="15" text-anchor="start" font-weight="700">6</text><text x="214" y="76" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Invest for your goals</text><text x="214" y="92" fill="#9caec4" font-size="11" text-anchor="start">SIPs for retirement and long-term goals</text><text x="20" y="398" fill="#9caec4" font-size="11" text-anchor="start">Each step protects the one above it, so a job loss or hospital bill does not force you to sell investments.</text></svg>
