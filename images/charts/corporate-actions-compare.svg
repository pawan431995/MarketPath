<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 312" width="800" height="312" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What corporate actions do to 100 shares at ₹1,000 (holding ₹1,00,000)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="312" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">What corporate actions do to 100 shares at ₹1,000 (holding ₹1,00,000)</text><rect x="20" y="70" width="180" height="170" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="20" y="70" width="180" height="4" rx="2" fill="#48e0b0"/><text x="110" y="100" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Dividend ₹20</text><text x="110" y="140" fill="#48e0b0" font-size="20" text-anchor="middle" font-weight="700">100 shares</text><text x="110" y="168" fill="#e7edf5" font-size="13" text-anchor="middle">≈ ₹980 each</text><line x1="36" y1="186" x2="184" y2="186" stroke="#2b3d54" stroke-width="1"/><text x="110" y="208" fill="#e7edf5" font-size="11.5" text-anchor="middle" font-weight="700">₹98,000 in shares</text><text x="110" y="225" fill="#9caec4" font-size="11.5" text-anchor="middle">+ ₹2,000 cash</text><rect x="213" y="70" width="180" height="170" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="213" y="70" width="180" height="4" rx="2" fill="#45a9d9"/><text x="303" y="100" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Bonus 1:1</text><text x="303" y="140" fill="#45a9d9" font-size="20" text-anchor="middle" font-weight="700">200 shares</text><text x="303" y="168" fill="#e7edf5" font-size="13" text-anchor="middle">≈ ₹500 each</text><line x1="229" y1="186" x2="377" y2="186" stroke="#2b3d54" stroke-width="1"/><text x="303" y="208" fill="#e7edf5" font-size="11.5" text-anchor="middle" font-weight="700">₹1,00,000</text><text x="303" y="225" fill="#9caec4" font-size="11.5" text-anchor="middle">value unchanged</text><rect x="406" y="70" width="180" height="170" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="406" y="70" width="180" height="4" rx="2" fill="#a994ff"/><text x="496" y="100" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Split 1 into 5</text><text x="496" y="140" fill="#a994ff" font-size="20" text-anchor="middle" font-weight="700">500 shares</text><text x="496" y="168" fill="#e7edf5" font-size="13" text-anchor="middle">≈ ₹200 each</text><line x1="422" y1="186" x2="570" y2="186" stroke="#2b3d54" stroke-width="1"/><text x="496" y="208" fill="#e7edf5" font-size="11.5" text-anchor="middle" font-weight="700">₹1,00,000</text><text x="496" y="225" fill="#9caec4" font-size="11.5" text-anchor="middle">value unchanged</text><rect x="599" y="70" width="180" height="170" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="599" y="70" width="180" height="4" rx="2" fill="#ffd27a"/><text x="689" y="100" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Rights 1 for 5 at ₹800</text><text x="689" y="140" fill="#ffd27a" font-size="20" text-anchor="middle" font-weight="700">120 shares</text><text x="689" y="168" fill="#e7edf5" font-size="13" text-anchor="middle">≈ ₹967 each</text><line x1="615" y1="186" x2="763" y2="186" stroke="#2b3d54" stroke-width="1"/><text x="689" y="208" fill="#e7edf5" font-size="11.5" text-anchor="middle" font-weight="700">₹1,16,000 in shares</text><text x="689" y="225" fill="#9caec4" font-size="11.5" text-anchor="middle">after paying ₹16,000</text><text x="400" y="268" fill="#e7edf5" font-size="12.5" text-anchor="middle">Bonus issues and splits change the count and the price, not the value.</text><text x="20" y="300" fill="#9caec4" font-size="11" text-anchor="start">Prices are the theoretical adjusted prices just after each action, before any market move. Dividends are taxable.</text></svg>
