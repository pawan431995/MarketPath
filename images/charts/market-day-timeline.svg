<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" width="800" height="310" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A trading day on NSE and BSE (Monday to Friday, except holidays)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="310" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">A trading day on NSE and BSE (Monday to Friday, except holidays)</text><line x1="40" y1="160" x2="760" y2="160" stroke="#2b3d54" stroke-width="2"/><line x1="64" y1="154" x2="64" y2="166" stroke="#9caec4" stroke-width="1"/><text x="64" y="184" fill="#9caec4" font-size="11" text-anchor="middle">9:00 am</text><line x1="160" y1="154" x2="160" y2="166" stroke="#9caec4" stroke-width="1"/><text x="160" y="184" fill="#9caec4" font-size="11" text-anchor="middle">10:00 am</text><line x1="256" y1="154" x2="256" y2="166" stroke="#9caec4" stroke-width="1"/><text x="256" y="184" fill="#9caec4" font-size="11" text-anchor="middle">11:00 am</text><line x1="352" y1="154" x2="352" y2="166" stroke="#9caec4" stroke-width="1"/><text x="352" y="184" fill="#9caec4" font-size="11" text-anchor="middle">12:00 pm</text><line x1="448" y1="154" x2="448" y2="166" stroke="#9caec4" stroke-width="1"/><text x="448" y="184" fill="#9caec4" font-size="11" text-anchor="middle">1:00 pm</text><line x1="544" y1="154" x2="544" y2="166" stroke="#9caec4" stroke-width="1"/><text x="544" y="184" fill="#9caec4" font-size="11" text-anchor="middle">2:00 pm</text><line x1="640" y1="154" x2="640" y2="166" stroke="#9caec4" stroke-width="1"/><text x="640" y="184" fill="#9caec4" font-size="11" text-anchor="middle">3:00 pm</text><line x1="736" y1="154" x2="736" y2="166" stroke="#9caec4" stroke-width="1"/><text x="736" y="184" fill="#9caec4" font-size="11" text-anchor="middle">4:00 pm</text><rect x="64" y="120" width="24" height="34" rx="5" fill="#ffd27a" opacity="0.9"/><rect x="88" y="120" width="600" height="34" rx="5" fill="#48e0b0" opacity="0.9"/><rect x="640" y="98" width="48" height="16" rx="5" fill="#a994ff" opacity="0.9"/><rect x="704" y="120" width="32" height="34" rx="5" fill="#45a9d9" opacity="0.9"/><text x="98" y="142" fill="#0b1220" font-size="12" text-anchor="start" font-weight="700">Normal market: continuous trading</text><rect x="40" y="203" width="12" height="12" rx="3" fill="#ffd27a"/><text x="60" y="214" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Pre-open 9:00–9:15</text><text x="60" y="229" fill="#9caec4" font-size="11" text-anchor="start">orders collected, opening price found</text><rect x="410" y="203" width="12" height="12" rx="3" fill="#48e0b0"/><text x="430" y="214" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Normal market 9:15–3:30</text><text x="430" y="229" fill="#9caec4" font-size="11" text-anchor="start">continuous buying and selling</text><rect x="40" y="239" width="12" height="12" rx="3" fill="#a994ff"/><text x="60" y="250" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Closing price 3:00–3:30</text><text x="60" y="265" fill="#9caec4" font-size="11" text-anchor="start">NSE: weighted average of last 30 minutes</text><rect x="410" y="239" width="12" height="12" rx="3" fill="#45a9d9"/><text x="430" y="250" fill="#e7edf5" font-size="12.5" text-anchor="start" font-weight="700">Post-close 3:40–4:00</text><text x="430" y="265" fill="#9caec4" font-size="11" text-anchor="start">trade only at the closing price</text><text x="20" y="298" fill="#9caec4" font-size="11" text-anchor="start">Times are indicative; exchanges publish the official timings and the yearly holiday list.</text></svg>
