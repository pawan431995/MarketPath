<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Who owns the company: a shareholding pattern (illustrative)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="320" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">Who owns the company: a shareholding pattern (illustrative)</text><path d="M190,70 A105,105 0 1 1 176.8,279.2 L182.2,236.5 A62,62 0 1 0 190,113 Z" fill="#48e0b0" stroke="#0e1726" stroke-width="2"/><path d="M176.8,279.2 A105,105 0 0 1 90.1,207.4 L131,194.2 A62,62 0 0 0 182.2,236.5 Z" fill="#45a9d9" stroke="#0e1726" stroke-width="2"/><path d="M90.1,207.4 A105,105 0 0 1 105.1,113.3 L139.8,138.6 A62,62 0 0 0 131,194.2 Z" fill="#a994ff" stroke="#0e1726" stroke-width="2"/><path d="M105.1,113.3 A105,105 0 0 1 190,70 L190,113 A62,62 0 0 0 139.8,138.6 Z" fill="#ffd27a" stroke="#0e1726" stroke-width="2"/><text x="190" y="173" fill="#e7edf5" font-size="18" text-anchor="middle" font-weight="700">100%</text><text x="190" y="191" fill="#9caec4" font-size="11" text-anchor="middle">of shares</text><rect x="360" y="80" width="14" height="14" rx="3" fill="#48e0b0"/><text x="384" y="92" fill="#e7edf5" font-size="13" text-anchor="start">Promoters</text><text x="760" y="92" fill="#e7edf5" font-size="13" text-anchor="end" font-weight="700">52%</text><rect x="360" y="120" width="14" height="14" rx="3" fill="#45a9d9"/><text x="384" y="132" fill="#e7edf5" font-size="13" text-anchor="start">Foreign institutions (FII/FPI)</text><text x="760" y="132" fill="#e7edf5" font-size="13" text-anchor="end" font-weight="700">18%</text><rect x="360" y="160" width="14" height="14" rx="3" fill="#a994ff"/><text x="384" y="172" fill="#e7edf5" font-size="13" text-anchor="start">Domestic institutions (DII, incl. mutual funds)</text><text x="760" y="172" fill="#e7edf5" font-size="13" text-anchor="end" font-weight="700">15%</text><rect x="360" y="200" width="14" height="14" rx="3" fill="#ffd27a"/><text x="384" y="212" fill="#e7edf5" font-size="13" text-anchor="start">Retail and others</text><text x="760" y="212" fill="#e7edf5" font-size="13" text-anchor="end" font-weight="700">15%</text><rect x="360" y="248" width="400" height="40" rx="8" fill="#2a1d24" stroke="#ff8e98" stroke-width="1.5"/><text x="376" y="273" fill="#e7edf5" font-size="12" text-anchor="start" font-weight="700">Watch: promoter shares pledged as loan collateral</text><text x="20" y="308" fill="#9caec4" font-size="11" text-anchor="start">Track the change each quarter: rising promoter or institutional holding is often read as confidence.</text></svg>
