<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif"><rect width="800" height="330" rx="14" fill="#0e1726"/><text x="20.0" y="30.0" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">P/E ratio comparison within one industry (illustrative)</text><text x="20.0" y="78.0" fill="#9caec4" font-size="13" text-anchor="start">Company A</text><rect x="170.0" y="60.0" width="99.6" height="32.0" fill="#48e0b0" opacity="0.85"/><text x="277.6" y="81.0" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">8x</text><text x="20.0" y="132.0" fill="#9caec4" font-size="13" text-anchor="start">Company B</text><rect x="170.0" y="114.0" width="149.3" height="32.0" fill="#48e0b0" opacity="0.85"/><text x="327.3" y="135.0" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">12x</text><text x="20.0" y="186.0" fill="#9caec4" font-size="13" text-anchor="start">Company C</text><rect x="170.0" y="168.0" width="224.0" height="32.0" fill="#ffd27a" opacity="0.85"/><text x="402.0" y="189.0" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">18x</text><text x="20.0" y="240.0" fill="#9caec4" font-size="13" text-anchor="start">Company D</text><rect x="170.0" y="222.0" width="311.1" height="32.0" fill="#ffd27a" opacity="0.85"/><text x="489.1" y="243.0" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">25x</text><text x="20.0" y="294.0" fill="#9caec4" font-size="13" text-anchor="start">Company E</text><rect x="170.0" y="276.0" width="497.8" height="32.0" fill="#ff8e98" opacity="0.85"/><text x="675.8" y="297.0" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">40x</text><text x="20.0" y="324.0" fill="#9caec4" font-size="11" text-anchor="start">Higher P/E = market expects more growth; check the reason before deciding.</text></svg>
