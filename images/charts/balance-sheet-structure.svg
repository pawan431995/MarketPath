<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="A balance sheet always balances: assets = liabilities + equity (₹ crore, illustrative)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="360" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">A balance sheet always balances: assets = liabilities + equity (₹ crore, illustrative)</text><rect x="70" y="74" width="220" height="98.8" rx="4" fill="#45a9d9" opacity="0.9"/><text x="180" y="128.4" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Fixed assets  420</text><rect x="70" y="174.8" width="220" height="26.8" rx="4" fill="#a994ff" opacity="0.9"/><text x="180" y="193.2" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Investments  120</text><rect x="70" y="203.6" width="220" height="36.4" rx="4" fill="#ffd27a" opacity="0.9"/><text x="180" y="226.8" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Inventory  160</text><rect x="70" y="242" width="220" height="41.2" rx="4" fill="#ffd27a" opacity="0.9"/><text x="180" y="267.6" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Receivables  180</text><rect x="70" y="285.2" width="220" height="26.8" rx="4" fill="#48e0b0" opacity="0.9"/><text x="180" y="303.6" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Cash  120</text><rect x="390" y="74" width="220" height="122.8" rx="4" fill="#48e0b0" opacity="0.9"/><text x="500" y="140.4" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Equity (capital + reserves)  520</text><rect x="390" y="198.8" width="220" height="53.2" rx="4" fill="#ff8e98" opacity="0.9"/><text x="500" y="230.4" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Long-term debt  230</text><rect x="390" y="254" width="220" height="58" rx="4" fill="#ffd27a" opacity="0.9"/><text x="500" y="288" fill="#0b1220" font-size="12" text-anchor="middle" font-weight="700">Current liabilities  250</text><text x="180" y="64" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">What the company owns</text><text x="500" y="64" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">How it is funded</text><text x="340" y="204" fill="#9caec4" font-size="34" text-anchor="middle" font-weight="700">=</text><rect x="636" y="110" width="146" height="140" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><text x="650" y="136" fill="#9caec4" font-size="12" text-anchor="start">Debt-to-equity</text><text x="650" y="156" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">230 / 520 = 0.44</text><text x="650" y="196" fill="#9caec4" font-size="12" text-anchor="start">Current ratio</text><text x="650" y="216" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">460 / 250 = 1.84</text><text x="20" y="348" fill="#9caec4" font-size="11" text-anchor="start">Current assets here = inventory + receivables + cash = 460. Both columns total 1,000.</text></svg>
