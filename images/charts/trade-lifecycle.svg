<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="What happens after you press Buy (equity, T+1 settlement)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9caec4"/></marker></defs><rect width="800" height="330" rx="14" fill="#0e1726"/><text x="20" y="30" fill="#e7edf5" font-size="14" text-anchor="start" font-weight="700">What happens after you press Buy (equity, T+1 settlement)</text><rect x="20" y="70" width="138" height="96" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="20" y="70" width="138" height="4" rx="2" fill="#48e0b0"/><text x="89" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">You</text><text x="89" y="118" fill="#9caec4" font-size="11" text-anchor="middle">Place an order</text><text x="89" y="134" fill="#9caec4" font-size="11" text-anchor="middle">in the broker app</text><line x1="160" y1="118" x2="172" y2="118" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="174" y="70" width="138" height="96" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="174" y="70" width="138" height="4" rx="2" fill="#a994ff"/><text x="243" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Broker</text><text x="243" y="118" fill="#9caec4" font-size="11" text-anchor="middle">Checks funds and</text><text x="243" y="134" fill="#9caec4" font-size="11" text-anchor="middle">sends the order</text><line x1="314" y1="118" x2="326" y2="118" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="328" y="70" width="138" height="96" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="328" y="70" width="138" height="4" rx="2" fill="#45a9d9"/><text x="397" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Exchange (NSE/BSE)</text><text x="397" y="118" fill="#9caec4" font-size="11" text-anchor="middle">Matches buyer</text><text x="397" y="134" fill="#9caec4" font-size="11" text-anchor="middle">and seller</text><line x1="468" y1="118" x2="480" y2="118" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="482" y="70" width="138" height="96" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="482" y="70" width="138" height="4" rx="2" fill="#ffd27a"/><text x="551" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Clearing corporation</text><text x="551" y="118" fill="#9caec4" font-size="11" text-anchor="middle">Guarantees both</text><text x="551" y="134" fill="#9caec4" font-size="11" text-anchor="middle">sides settle</text><line x1="622" y1="118" x2="634" y2="118" stroke="#9caec4" stroke-width="2" marker-end="url(#arr)"/><rect x="636" y="70" width="138" height="96" rx="8" fill="#142238" stroke="#2b3d54" stroke-width="1.5"/><rect x="636" y="70" width="138" height="4" rx="2" fill="#48e0b0"/><text x="705" y="98" fill="#e7edf5" font-size="13" text-anchor="middle" font-weight="700">Depository (CDSL/NSDL)</text><text x="705" y="118" fill="#9caec4" font-size="11" text-anchor="middle">Moves shares to</text><text x="705" y="134" fill="#9caec4" font-size="11" text-anchor="middle">your demat</text><rect x="20" y="200" width="360" height="70" rx="8" fill="#132f31" stroke="#2e796b" stroke-width="1.5"/><text x="36" y="226" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Trade day (T): order matched</text><text x="36" y="248" fill="#9caec4" font-size="11.5" text-anchor="start">You see an executed order and a contract note.</text><rect x="420" y="200" width="360" height="70" rx="8" fill="#1d2840" stroke="#a994ff" stroke-width="1.5"/><text x="436" y="226" fill="#e7edf5" font-size="13" text-anchor="start" font-weight="700">Next trading day (T+1): settlement</text><text x="436" y="248" fill="#9caec4" font-size="11.5" text-anchor="start">Shares reach your demat; sale money reaches your account.</text><line x1="384" y1="235" x2="416" y2="235" stroke="#48e0b0" stroke-width="2" marker-end="url(#arr)"/><text x="20" y="318" fill="#9caec4" font-size="11" text-anchor="start">Illustrative flow. Your broker and the depository send you SMS and email confirmations at each step.</text></svg>
